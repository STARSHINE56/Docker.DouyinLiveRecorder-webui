name: Xiaolan WebDAV Auto Upload V3.1

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xiaolan-webdav-auto-upload-v31
  cancel-in-progress: false

jobs:
  patch:
    name: Xiaolan WebDAV Auto Upload
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply all changes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          # =========================================================
          # 1. config/config.ini
          # =========================================================

          config_path = Path("config/config.ini")

          config_text = config_path.read_text(
              encoding="utf-8-sig"
          )

          # 删除旧的小蓝网盘配置段，避免重复
          config_text = re.sub(
              r"\n*\[小蓝网盘\][\s\S]*?(?=\n\[[^\]]+\]|\Z)",
              "",
              config_text
          ).rstrip()

          xiaolan_config = """
          [小蓝网盘]
          WebDAV地址 =
          WebDAV用户名 =
          WebDAV密码 =
          上传根目录 = /直播录像/
          自动上传录像 = 否
          按主播创建文件夹 = 是
          按日期创建文件夹 = 否
          上传成功后删除本地 = 否
          上传失败重试次数 = 3
          等待MP4最长时间(秒) = 1800
          """

          config_text = (
              config_text
              + "\n\n"
              + xiaolan_config.strip()
              + "\n"
          )

          # 启用录制完成后执行脚本
          if re.search(
              r"是否录制完成后执行自定义脚本\s*=",
              config_text
          ):
              config_text = re.sub(
                  r"是否录制完成后执行自定义脚本\s*=\s*.*",
                  "是否录制完成后执行自定义脚本 = 是",
                  config_text,
                  count=1
              )

          if re.search(
              r"自定义脚本执行命令\s*=",
              config_text
          ):
              config_text = re.sub(
                  r"自定义脚本执行命令\s*=\s*.*",
                  "自定义脚本执行命令 = python upload_after_record.py",
                  config_text,
                  count=1
              )

          config_path.write_text(
              config_text,
              encoding="utf-8-sig"
          )

          print("OK 1: config.ini")

          # =========================================================
          # 2. upload_after_record.py
          # =========================================================

          uploader = r'''#!/usr/bin/env python3

          import argparse
          import configparser
          import re
          import sys
          import time
          import urllib.parse
          from datetime import datetime
          from pathlib import Path

          import requests


          CONFIG_FILE = Path("config/config.ini")


          def log(message):
              print(
                  f"[XiaolanUpload] {message}",
                  flush=True
              )


          def yes(value):
              return str(value).strip().lower() in {
                  "是",
                  "yes",
                  "true",
                  "1",
                  "on",
              }


          def safe_name(value):
              value = str(value or "").strip()

              value = re.sub(
                  r'[\\/:*?"<>|]',
                  "_",
                  value
              )

              value = re.sub(
                  r"\s+",
                  " ",
                  value
              ).strip(" ._")

              return value or "未知主播"


          def load_config():
              config = configparser.ConfigParser(
                  interpolation=None
              )

              config.read(
                  CONFIG_FILE,
                  encoding="utf-8-sig"
              )

              if "小蓝网盘" not in config:
                  raise RuntimeError(
                      "config.ini 缺少 [小蓝网盘]"
                  )

              return config["小蓝网盘"]


          def join_url(base, *parts):
              base = base.rstrip("/") + "/"

              encoded = []

              for part in parts:
                  part = str(part).strip("/")

                  if not part:
                      continue

                  encoded.append(
                      urllib.parse.quote(
                          part,
                          safe=""
                      )
                  )

              return base + "/".join(encoded)


          def ensure_collection(
              session,
              url,
              auth
          ):
              response = session.request(
                  "PROPFIND",
                  url,
                  auth=auth,
                  headers={
                      "Depth": "0",
                      "User-Agent":
                          "DouyinLiveRecorder-WebDAV"
                  },
                  timeout=30,
                  allow_redirects=True
              )

              if response.status_code in (
                  200,
                  207,
              ):
                  return

              if response.status_code == 404:
                  mkcol = session.request(
                      "MKCOL",
                      url,
                      auth=auth,
                      timeout=30,
                      allow_redirects=True
                  )

                  if mkcol.status_code not in (
                      200,
                      201,
                      204,
                      301,
                      302,
                      405,
                  ):
                      raise RuntimeError(
                          "创建远程目录失败 "
                          f"HTTP {mkcol.status_code}"
                      )

                  return

              if response.status_code in (
                  301,
                  302,
                  405,
              ):
                  return

              raise RuntimeError(
                  "检查远程目录失败 "
                  f"HTTP {response.status_code}"
              )


          def ensure_remote_path(
              session,
              base_url,
              root_dir,
              anchor_dir,
              date_dir,
              auth
          ):
              current = base_url.rstrip("/")

              path_parts = []

              for source in (
                  root_dir,
                  anchor_dir,
                  date_dir,
              ):
                  if not source:
                      continue

                  for part in str(source).split("/"):
                      part = part.strip()

                      if part:
                          path_parts.append(part)

              for part in path_parts:
                  current = join_url(
                      current,
                      part
                  )

                  ensure_collection(
                      session,
                      current,
                      auth
                  )

              return current


          def stable_file(
              path,
              checks=3,
              interval=3
          ):
              previous = -1

              for _ in range(checks):
                  if not path.exists():
                      return False

                  size = path.stat().st_size

                  if size <= 0:
                      return False

                  if previous == size:
                      return True

                  previous = size

                  time.sleep(interval)

              return (
                  path.exists()
                  and path.stat().st_size > 0
              )


          def find_mp4_files(
              save_file_path,
              wait_seconds
          ):
              source = Path(save_file_path)

              directory = source.parent

              stem = source.stem

              prefix = (
                  stem.rsplit("_", 1)[0]
                  if "_" in stem
                  else stem
              )

              deadline = (
                  time.time()
                  + max(
                      30,
                      wait_seconds
                  )
              )

              last_seen = []

              stable_rounds = 0

              log(
                  "等待 MP4 转换完成，"
                  f"最长 {wait_seconds} 秒"
              )

              while time.time() < deadline:
                  candidates = sorted(
                      [
                          p
                          for p in directory.glob("*.mp4")
                          if (
                              p.stem == stem
                              or p.stem.startswith(
                                  prefix
                              )
                          )
                      ],
                      key=lambda p:
                          p.stat().st_mtime
                  )

                  candidates = [
                      p
                      for p in candidates
                      if p.stat().st_size > 0
                  ]

                  names = [
                      (
                          str(p),
                          p.stat().st_size
                      )
                      for p in candidates
                  ]

                  if (
                      candidates
                      and names == last_seen
                  ):
                      stable_rounds += 1
                  else:
                      stable_rounds = 0

                  last_seen = names

                  if (
                      candidates
                      and stable_rounds >= 3
                      and all(
                          stable_file(
                              p,
                              checks=2,
                              interval=2
                          )
                          for p in candidates
                      )
                  ):
                      return candidates

                  time.sleep(5)

              return [
                  p
                  for p in directory.glob("*.mp4")
                  if (
                      p.stem == stem
                      or p.stem.startswith(
                          prefix
                      )
                  )
                  and p.stat().st_size > 0
              ]


          def upload_file(
              session,
              local_file,
              remote_dir_url,
              auth,
              retries
          ):
              remote_url = join_url(
                  remote_dir_url,
                  local_file.name
              )

              for attempt in range(
                  1,
                  retries + 1
              ):
                  try:
                      size = (
                          local_file.stat().st_size
                      )

                      log(
                          f"上传 {local_file.name} "
                          f"({size / 1024 / 1024:.1f} MB) "
                          f"第 {attempt}/{retries} 次"
                      )

                      with local_file.open(
                          "rb"
                      ) as fp:
                          response = session.put(
                              remote_url,
                              data=fp,
                              auth=auth,
                              headers={
                                  "Content-Type":
                                      "video/mp4",
                                  "User-Agent":
                                      "DouyinLiveRecorder-WebDAV"
                              },
                              timeout=(
                                  30,
                                  3600
                              ),
                              allow_redirects=True
                          )

                      if response.status_code in (
                          200,
                          201,
                          204,
                      ):
                          verify = session.request(
                              "PROPFIND",
                              remote_url,
                              auth=auth,
                              headers={
                                  "Depth": "0"
                              },
                              timeout=30,
                              allow_redirects=True
                          )

                          if verify.status_code in (
                              200,
                              207,
                          ):
                              log(
                                  "上传成功并通过远端校验: "
                                  f"{local_file.name}"
                              )

                              return True

                          log(
                              "上传完成但远端校验失败 "
                              f"HTTP {verify.status_code}"
                          )

                      else:
                          log(
                              "上传失败 "
                              f"HTTP {response.status_code}"
                          )

                  except Exception as exc:
                      log(
                          f"上传异常: {exc}"
                      )

                  if attempt < retries:
                      wait = min(
                          60,
                          attempt * 10
                      )

                      log(
                          f"{wait} 秒后重试"
                      )

                      time.sleep(wait)

              return False


          def main():
              parser = argparse.ArgumentParser(
                  add_help=False
              )

              parser.add_argument(
                  "--record_name",
                  default=""
              )

              parser.add_argument(
                  "--save_file_path",
                  default=""
              )

              args, _ = parser.parse_known_args()

              if not args.save_file_path:
                  log(
                      "没有收到录像文件路径，"
                      "跳过上传"
                  )

                  return 0

              cfg = load_config()

              if not yes(
                  cfg.get(
                      "自动上传录像",
                      "否"
                  )
              ):
                  log(
                      "自动上传未开启，跳过"
                  )

                  return 0

              webdav_url = cfg.get(
                  "WebDAV地址",
                  ""
              ).strip()

              username = cfg.get(
                  "WebDAV用户名",
                  ""
              ).strip()

              password = cfg.get(
                  "WebDAV密码",
                  ""
              )

              if not webdav_url:
                  log(
                      "WebDAV 地址为空，"
                      "取消上传"
                  )

                  return 1

              if not webdav_url.startswith(
                  ("http://", "https://")
              ):
                  log(
                      "WebDAV 地址格式错误"
                  )

                  return 1

              root_dir = cfg.get(
                  "上传根目录",
                  "/直播录像/"
              ).strip()

              by_anchor = yes(
                  cfg.get(
                      "按主播创建文件夹",
                      "是"
                  )
              )

              by_date = yes(
                  cfg.get(
                      "按日期创建文件夹",
                      "否"
                  )
              )

              delete_local = yes(
                  cfg.get(
                      "上传成功后删除本地",
                      "否"
                  )
              )

              try:
                  retries = max(
                      1,
                      int(
                          cfg.get(
                              "上传失败重试次数",
                              "3"
                          )
                      )
                  )

              except ValueError:
                  retries = 3

              try:
                  wait_seconds = max(
                      30,
                      int(
                          cfg.get(
                              "等待MP4最长时间(秒)",
                              "1800"
                          )
                      )
                  )

              except ValueError:
                  wait_seconds = 1800

              anchor_name = safe_name(
                  args.record_name
              )

              if " " in anchor_name:
                  anchor_name = safe_name(
                      anchor_name.split(
                          " ",
                          1
                      )[-1]
                  )

              anchor_dir = (
                  anchor_name
                  if by_anchor
                  else ""
              )

              date_dir = (
                  datetime.now().strftime(
                      "%Y-%m-%d"
                  )
                  if by_date
                  else ""
              )

              mp4_files = find_mp4_files(
                  args.save_file_path,
                  wait_seconds
              )

              if not mp4_files:
                  log(
                      "没有找到转换完成的 MP4，"
                      "不会上传，也不会删除原文件"
                  )

                  return 1

              session = requests.Session()

              auth = (
                  username,
                  password
              )

              try:
                  remote_dir = (
                      ensure_remote_path(
                          session,
                          webdav_url,
                          root_dir,
                          anchor_dir,
                          date_dir,
                          auth
                      )
                  )

              except Exception as exc:
                  log(
                      f"创建远端目录失败: {exc}"
                  )

                  return 1

              all_success = True

              for mp4_file in mp4_files:
                  ok = upload_file(
                      session,
                      mp4_file,
                      remote_dir,
                      auth,
                      retries
                  )

                  if not ok:
                      all_success = False

                      log(
                          "上传失败，保留本地文件: "
                          f"{mp4_file}"
                      )

                      continue

                  if delete_local:
                      try:
                          mp4_file.unlink()

                          log(
                              "远端校验成功，"
                              "已删除本地文件: "
                              f"{mp4_file.name}"
                          )

                      except Exception as exc:
                          log(
                              "上传成功，但删除"
                              f"本地文件失败: {exc}"
                          )

              if all_success:
                  log(
                      "本次录像上传任务全部完成"
                  )

                  return 0

              log(
                  "部分文件上传失败，"
                  "失败文件已保留"
              )

              return 1


          if __name__ == "__main__":
              sys.exit(main())
          '''

          uploader = "\n".join(
              line[10:]
              if line.startswith("          ")
              else line
              for line in uploader.splitlines()
          ).lstrip()

          Path(
              "upload_after_record.py"
          ).write_text(
              uploader,
              encoding="utf-8"
          )

          print(
              "OK 2: upload_after_record.py"
          )

          # =========================================================
          # 3. webui.py
          # =========================================================

          webui_path = Path("webui.py")

          webui = webui_path.read_text(
              encoding="utf-8"
          )

          if "import requests" not in webui:
              marker = "import subprocess\n"

              if marker not in webui:
                  raise RuntimeError(
                      "webui.py 找不到 import subprocess"
                  )

              webui = webui.replace(
                  marker,
                  marker + "import requests\n",
                  1
              )

          # 清除旧的小蓝路由
          old_start = webui.find(
              "@app.route('/xiaolan_webdav'"
          )

          if old_start >= 0:
              old_end = webui.find(
                  "@app.route('/log')",
                  old_start
              )

              if old_end < 0:
                  raise RuntimeError(
                      "发现旧小蓝路由，"
                      "但找不到 /log 路由"
                  )

              webui = (
                  webui[:old_start]
                  + webui[old_end:]
              )

          route_code = r'''
          @app.route(
              '/xiaolan_webdav',
              methods=['GET', 'POST']
          )
          def xiaolan_webdav_page():
              config_path = os.path.join(
                  os.getcwd(),
                  'config',
                  'config.ini'
              )

              config = read_config(
                  config_path
              )

              if '小蓝网盘' not in config:
                  config.add_section(
                      '小蓝网盘'
                  )

              if request.method == 'POST':
                  keys = [
                      'WebDAV地址',
                      'WebDAV用户名',
                      'WebDAV密码',
                      '上传根目录',
                      '自动上传录像',
                      '按主播创建文件夹',
                      '按日期创建文件夹',
                      '上传成功后删除本地',
                      '上传失败重试次数',
                      '等待MP4最长时间(秒)',
                  ]

                  for key in keys:
                      if key in request.form:
                          config.set(
                              '小蓝网盘',
                              key,
                              request.form.get(
                                  key,
                                  ''
                              ).strip()
                          )

                  write_config(
                      config,
                      config_path
                  )

                  return redirect(
                      url_for(
                          'xiaolan_webdav_page',
                          success='true'
                      )
                  )

              return render_template(
                  'index.html',
                  config=config,
                  active_tab='xiaolan_webdav',
                  section='小蓝网盘'
              )


          @app.route(
              '/xiaolan_webdav/test',
              methods=['POST']
          )
          def test_xiaolan_webdav():
              config_path = os.path.join(
                  os.getcwd(),
                  'config',
                  'config.ini'
              )

              config = read_config(
                  config_path
              )

              if '小蓝网盘' not in config:
                  return {
                      'success': False,
                      'message':
                          '请先保存 WebDAV 配置'
                  }, 400

              url = config.get(
                  '小蓝网盘',
                  'WebDAV地址',
                  fallback=''
              ).strip()

              username = config.get(
                  '小蓝网盘',
                  'WebDAV用户名',
                  fallback=''
              ).strip()

              password = config.get(
                  '小蓝网盘',
                  'WebDAV密码',
                  fallback=''
              )

              if not url:
                  return {
                      'success': False,
                      'message':
                          'WebDAV 地址不能为空'
                  }, 400

              if not url.startswith(
                  ('http://', 'https://')
              ):
                  return {
                      'success': False,
                      'message':
                          'WebDAV 地址格式错误'
                  }, 400

              try:
                  response = requests.request(
                      'PROPFIND',
                      url,
                      auth=(
                          username,
                          password
                      ),
                      headers={
                          'Depth': '0',
                          'User-Agent':
                              'DouyinLiveRecorder-WebDAV'
                      },
                      timeout=15,
                      allow_redirects=True
                  )

                  if response.status_code in (
                      200,
                      201,
                      204,
                      207,
                  ):
                      return {
                          'success': True,
                          'message':
                              '小蓝网盘 WebDAV '
                              '连接成功'
                      }

                  messages = {
                      401:
                          '认证失败，请检查用户名和密码',
                      403:
                          '访问被拒绝，请检查权限',
                      404:
                          'WebDAV 地址不存在',
                  }

                  return {
                      'success': False,
                      'message': messages.get(
                          response.status_code,
                          '连接失败，HTTP '
                          + str(
                              response.status_code
                          )
                      )
                  }, 400

              except requests.exceptions.Timeout:
                  return {
                      'success': False,
                      'message': '连接超时'
                  }, 400

              except requests.exceptions.SSLError:
                  return {
                      'success': False,
                      'message': 'SSL 证书错误'
                  }, 400

              except requests.exceptions.RequestException as exc:
                  logger.error(
                      f'小蓝 WebDAV 连接失败: {exc}'
                  )

                  return {
                      'success': False,
                      'message':
                          '无法连接 WebDAV 服务器'
                  }, 400


          '''

          route_code = "\n".join(
              line[10:]
              if line.startswith("          ")
              else line
              for line in route_code.splitlines()
          ).lstrip()

          insert_at = webui.find(
              "@app.route('/log')"
          )

          if insert_at < 0:
              raise RuntimeError(
                  "webui.py 找不到 /log 路由"
              )

          webui = (
              webui[:insert_at]
              + route_code
              + "\n"
              + webui[insert_at:]
          )

          webui_path.write_text(
              webui,
              encoding="utf-8"
          )

          print("OK 3: webui.py")

          # =========================================================
          # 4. templates/index.html
          # =========================================================

          html_path = Path(
              "templates/index.html"
          )

          html = html_path.read_text(
              encoding="utf-8"
          )

          # 删除可能存在的旧小蓝菜单
          html = re.sub(
              r'\s*<a[^>]*xiaolan_webdav_page[\s\S]*?</a>',
              '',
              html
          )

          account_marker = (
              '<a href="{{ url_for('
              "'account_settings_page'"
              ') }}"'
          )

          account_index = html.find(
              account_marker
          )

          if account_index < 0:
              raise RuntimeError(
                  "index.html 找不到账号密码菜单"
              )

          account_end = html.find(
              "</a>",
              account_index
          )

          if account_end < 0:
              raise RuntimeError(
                  "账号密码菜单没有结束标签"
              )

          account_end += len("</a>")

          new_tab = '''
                <a href="{{ url_for('xiaolan_webdav_page') }}"
                   class="tab-button {% if active_tab == 'xiaolan_webdav' %}active{% endif %}">
                    小蓝网盘
                </a>'''

          html = (
              html[:account_end]
              + new_tab
              + html[account_end:]
          )

          # 删除之前可能残留的页面内容
          html = re.sub(
              r'\s*\{% elif active_tab == [\'"]xiaolan_webdav[\'"] %\}[\s\S]*?(?=\{% endif %\})',
              '',
              html
          )

          script_marker = (
              "\n    <script>\n"
              "        let lastLogContent"
          )

          script_pos = html.find(
              script_marker
          )

          if script_pos < 0:
              raise RuntimeError(
                  "index.html 找不到日志脚本位置"
              )

          endif_pos = html.rfind(
              "{% endif %}",
              0,
              script_pos
          )

          if endif_pos < 0:
              raise RuntimeError(
                  "index.html 找不到主页面 endif"
              )

          page = r'''
            {% elif active_tab == 'xiaolan_webdav' %}
            <div class="config-section">
                <h2>小蓝网盘 WebDAV</h2>

                <p style="
                    color: #666;
                    line-height: 1.7;
                ">
                    录像先完成 MP4 转换，
                    然后再上传小蓝网盘。
                    每个主播可以自动创建独立文件夹。
                    上传成功并通过远端校验以后，
                    才会根据设置删除本地 MP4。
                </p>

                <form
                    action="{{ url_for('xiaolan_webdav_page') }}"
                    method="post"
                >
                    <div class="form-group">
                        <label>WebDAV 地址</label>

                        <input
                            type="text"
                            name="WebDAV地址"
                            placeholder="https://..."
                            value="{{ config.get(
                                section,
                                'WebDAV地址',
                                fallback=''
                            ) }}"
                        >
                    </div>

                    <div class="form-group">
                        <label>WebDAV 用户名</label>

                        <input
                            type="text"
                            name="WebDAV用户名"
                            value="{{ config.get(
                                section,
                                'WebDAV用户名',
                                fallback=''
                            ) }}"
                        >
                    </div>

                    <div class="form-group">
                        <label>WebDAV 密码</label>

                        <input
                            type="password"
                            name="WebDAV密码"
                            value="{{ config.get(
                                section,
                                'WebDAV密码',
                                fallback=''
                            ) }}"
                            style="
                                width: calc(100% - 22px);
                                padding: 10px;
                                border: 1px solid #ccc;
                                border-radius: 4px;
                                box-sizing: border-box;
                            "
                        >
                    </div>

                    <div class="form-group">
                        <label>上传根目录</label>

                        <input
                            type="text"
                            name="上传根目录"
                            value="{{ config.get(
                                section,
                                '上传根目录',
                                fallback='/直播录像/'
                            ) }}"
                        >
                    </div>

                    <div class="form-group">
                        <label>自动上传录像</label>

                        {% set v = config.get(
                            section,
                            '自动上传录像',
                            fallback='否'
                        ) %}

                        <select
                            name="自动上传录像"
                            style="
                                height: 38px;
                                width: 200px;
                            "
                        >
                            <option
                                value="是"
                                {% if v == '是' %}selected{% endif %}
                            >
                                是
                            </option>

                            <option
                                value="否"
                                {% if v != '是' %}selected{% endif %}
                            >
                                否
                            </option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>
                            按主播创建文件夹
                        </label>

                        {% set v = config.get(
                            section,
                            '按主播创建文件夹',
                            fallback='是'
                        ) %}

                        <select
                            name="按主播创建文件夹"
                            style="
                                height: 38px;
                                width: 200px;
                            "
                        >
                            <option
                                value="是"
                                {% if v == '是' %}selected{% endif %}
                            >
                                是
                            </option>

                            <option
                                value="否"
                                {% if v != '是' %}selected{% endif %}
                            >
                                否
                            </option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>
                            按日期创建文件夹
                        </label>

                        {% set v = config.get(
                            section,
                            '按日期创建文件夹',
                            fallback='否'
                        ) %}

                        <select
                            name="按日期创建文件夹"
                            style="
                                height: 38px;
                                width: 200px;
                            "
                        >
                            <option
                                value="是"
                                {% if v == '是' %}selected{% endif %}
                            >
                                是
                            </option>

                            <option
                                value="否"
                                {% if v != '是' %}selected{% endif %}
                            >
                                否
                            </option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>
                            上传成功后删除本地
                        </label>

                        {% set v = config.get(
                            section,
                            '上传成功后删除本地',
                            fallback='否'
                        ) %}

                        <select
                            name="上传成功后删除本地"
                            style="
                                height: 38px;
                                width: 200px;
                            "
                        >
                            <option
                                value="是"
                                {% if v == '是' %}selected{% endif %}
                            >
                                是
                            </option>

                            <option
                                value="否"
                                {% if v != '是' %}selected{% endif %}
                            >
                                否
                            </option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>
                            上传失败重试次数
                        </label>

                        <input
                            type="text"
                            name="上传失败重试次数"
                            value="{{ config.get(
                                section,
                                '上传失败重试次数',
                                fallback='3'
                            ) }}"
                        >
                    </div>

                    <div class="form-group">
                        <label>
                            等待 MP4 最长时间（秒）
                        </label>

                        <input
                            type="text"
                            name="等待MP4最长时间(秒)"
                            value="{{ config.get(
                                section,
                                '等待MP4最长时间(秒)',
                                fallback='1800'
                            ) }}"
                        >
                    </div>

                    <button type="submit">
                        保存小蓝网盘设置
                    </button>
                </form>

                <button
                    type="button"
                    id="xiaolan-test-btn"
                    style="
                        width: 100%;
                        margin-top: 12px;
                        padding: 12px;
                        border: none;
                        border-radius: 5px;
                        background: #007bff;
                        color: white;
                        font-size: 16px;
                        cursor: pointer;
                    "
                >
                    测试 WebDAV 连接
                </button>

                <div
                    id="xiaolan-test-result"
                    style="
                        display: none;
                        margin-top: 12px;
                        padding: 12px;
                        border-radius: 5px;
                    "
                ></div>
            </div>

          '''

          page = "\n".join(
              line[10:]
              if line.startswith("          ")
              else line
              for line in page.splitlines()
          )

          html = (
              html[:endif_pos]
              + page
              + html[endif_pos:]
          )

          # 删除旧测试 JS
          html = re.sub(
              r'\s*<script id="xiaolan-test-script-v3">[\s\S]*?</script>',
              '',
              html
          )

          body_pos = html.rfind(
              "</body>"
          )

          if body_pos < 0:
              raise RuntimeError(
                  "index.html 找不到 </body>"
              )

          test_js = r'''
          <script id="xiaolan-test-script-v3">
          document.addEventListener(
              'DOMContentLoaded',
              function () {
                  const button =
                      document.getElementById(
                          'xiaolan-test-btn'
                      );

                  const result =
                      document.getElementById(
                          'xiaolan-test-result'
                      );

                  if (!button || !result) {
                      return;
                  }

                  button.addEventListener(
                      'click',
                      async function () {
                          button.disabled = true;

                          button.textContent =
                              '正在测试...';

                          result.style.display =
                              'block';

                          result.style.background =
                              '#eef2f7';

                          result.style.color =
                              '#333';

                          result.textContent =
                              '正在连接小蓝网盘...';

                          try {
                              const response =
                                  await fetch(
                                      '/xiaolan_webdav/test',
                                      {
                                          method: 'POST'
                                      }
                                  );

                              const data =
                                  await response.json();

                              if (
                                  response.ok
                                  && data.success
                              ) {
                                  result.style.background =
                                      '#d4edda';

                                  result.style.color =
                                      '#155724';
                              } else {
                                  result.style.background =
                                      '#f8d7da';

                                  result.style.color =
                                      '#721c24';
                              }

                              result.textContent =
                                  data.message
                                  || '未知结果';

                          } catch (error) {
                              result.style.background =
                                  '#f8d7da';

                              result.style.color =
                                  '#721c24';

                              result.textContent =
                                  '测试请求失败';

                          } finally {
                              button.disabled =
                                  false;

                              button.textContent =
                                  '测试 WebDAV 连接';
                          }
                      }
                  );
              }
          );
          </script>

          '''

          test_js = "\n".join(
              line[10:]
              if line.startswith("          ")
              else line
              for line in test_js.splitlines()
          )

          html = (
              html[:body_pos]
              + test_js
              + html[body_pos:]
          )

          html_path.write_text(
              html,
              encoding="utf-8"
          )

          print(
              "OK 4: templates/index.html"
          )

          print("")
          print("============================")
          print("V3.1 patch completed")
          print("============================")
          PY

      - name: Clean whitespace
        run: |
          python <<'PY'
          from pathlib import Path

          files = [
              Path("templates/index.html"),
              Path("webui.py"),
              Path("upload_after_record.py"),
              Path("config/config.ini"),
          ]

          for path in files:
              if not path.exists():
                  continue

              encoding = (
                  "utf-8-sig"
                  if path.name == "config.ini"
                  else "utf-8"
              )

              text = path.read_text(
                  encoding=encoding
              )

              lines = [
                  line.rstrip()
                  for line in text.splitlines()
              ]

              cleaned = (
                  "\n".join(lines)
                  + "\n"
              )

              path.write_text(
                  cleaned,
                  encoding=encoding
              )

              print(
                  f"OK: cleaned {path}"
              )
          PY

      - name: Check diff
        run: |
          git diff --check
          git status --short
          git diff --stat

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python syntax check
        run: |
          python -m py_compile webui.py
          python -m py_compile main.py
          python -m py_compile upload_after_record.py

      - name: Flask route check
        run: |
          python <<'PY'
          import webui

          routes = {
              rule.rule
              for rule
              in webui.app.url_map.iter_rules()
          }

          required = {
              "/xiaolan_webdav",
              "/xiaolan_webdav/test",
          }

          missing = (
              required - routes
          )

          if missing:
              raise RuntimeError(
                  f"缺少 Flask 路由: {missing}"
              )

          print(
              "OK: Flask routes"
          )
          PY

      - name: Template render check
        run: |
          python <<'PY'
          import webui

          client = (
              webui.app.test_client()
          )

          response = client.get(
              "/xiaolan_webdav"
          )

          print(
              "HTTP:",
              response.status_code
          )

          if response.status_code != 200:
              print(
                  response.data.decode(
                      "utf-8",
                      errors="replace"
                  )
              )

              raise RuntimeError(
                  "小蓝网盘页面渲染失败"
              )

          html = response.data.decode(
              "utf-8",
              errors="replace"
          )

          required = [
              "小蓝网盘",
              "WebDAV 地址",
              "自动上传录像",
              "按主播创建文件夹",
              "按日期创建文件夹",
              "上传成功后删除本地",
              "测试 WebDAV 连接",
          ]

          for item in required:
              if item not in html:
                  raise RuntimeError(
                      f"页面缺少内容: {item}"
                  )

          print(
              "OK: template render"
          )
          PY

      - name: Config check
        run: |
          python <<'PY'
          import configparser

          config = (
              configparser.ConfigParser(
                  interpolation=None
              )
          )

          config.read(
              "config/config.ini",
              encoding="utf-8-sig"
          )

          if "小蓝网盘" not in config:
              raise RuntimeError(
                  "缺少 [小蓝网盘]"
              )

          section = config[
              "小蓝网盘"
          ]

          required = [
              "webdav地址",
              "webdav用户名",
              "webdav密码",
              "上传根目录",
              "自动上传录像",
              "按主播创建文件夹",
              "按日期创建文件夹",
              "上传成功后删除本地",
              "上传失败重试次数",
              "等待mp4最长时间(秒)",
          ]

          for key in required:
              if key not in section:
                  raise RuntimeError(
                      f"缺少配置: {key}"
                  )

          if "录制设置" not in config:
              raise RuntimeError(
                  "缺少 [录制设置]"
              )

          recording = config[
              "录制设置"
          ]

          if (
              recording.get(
                  "是否录制完成后执行自定义脚本",
                  ""
              )
              != "是"
          ):
              raise RuntimeError(
                  "录制完成脚本没有启用"
              )

          command = recording.get(
              "自定义脚本执行命令",
              ""
          )

          if (
              "upload_after_record.py"
              not in command
          ):
              raise RuntimeError(
                  "上传脚本没有接入"
              )

          print(
              "OK: config"
          )
          PY

      - name: Uploader dry run
        run: |
          python upload_after_record.py \
            --record_name "测试主播" \
            --save_file_path "/tmp/test.ts"

      - name: Commit changes
        run: |
          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            webui.py \
            templates/index.html \
            config/config.ini \
            upload_after_record.py

          if git diff --cached --quiet; then
            echo "没有需要提交的修改"
            exit 0
          fi

          git commit \
            -m "feat: add Xiaolan WebDAV MP4 auto upload"

          git push origin HEAD:main

      - name: Summary
        run: |
          {
            echo "## ✅ 小蓝网盘 WebDAV V3.1"
            echo
            echo "已完成："
            echo
            echo "- 修复模板插入问题"
            echo "- 修复 trailing whitespace"
            echo "- WebUI 小蓝网盘页面"
            echo "- WebDAV 连接测试"
            echo "- 自动上传 MP4"
            echo "- 每个主播独立目录"
            echo "- 可选日期目录"
            echo "- 上传失败自动重试"
            echo "- 上传后远端校验"
            echo "- 校验成功后可删除本地 MP4"
            echo "- 上传失败保留本地文件"
            echo
            echo "默认自动上传：否"
            echo "默认上传成功删除本地：否"
          } >> "$GITHUB_STEP_SUMMARY"
