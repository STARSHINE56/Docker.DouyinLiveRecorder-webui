name: Xiaolan WebDAV Auto Upload V3.3

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xiaolan-webdav-auto-upload-v33
  cancel-in-progress: false

jobs:
  patch:
    name: Xiaolan WebDAV Auto Upload V3.3
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Update config
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import configparser

          path = Path("config/config.ini")

          config = configparser.ConfigParser(
              interpolation=None
          )

          config.optionxform = str

          config.read(
              path,
              encoding="utf-8-sig"
          )

          if "录制设置" not in config:
              raise RuntimeError(
                  "缺少 [录制设置]"
              )

          config["录制设置"][
              "是否录制完成后执行自定义脚本"
          ] = "是"

          config["录制设置"][
              "自定义脚本执行命令"
          ] = "python upload_after_record.py"

          if "小蓝网盘" not in config:
              config.add_section(
                  "小蓝网盘"
              )

          defaults = {
              "WebDAV地址": "",
              "WebDAV用户名": "",
              "WebDAV密码": "",
              "上传根目录": "/直播录像/",
              "自动上传录像": "否",
              "按主播创建文件夹": "是",
              "按日期创建文件夹": "否",
              "上传成功后删除本地": "否",
              "上传失败重试次数": "3",
              "等待MP4最长时间(秒)": "1800",
          }

          for key, value in defaults.items():
              if key not in config["小蓝网盘"]:
                  config["小蓝网盘"][key] = value

          with path.open(
              "w",
              encoding="utf-8-sig"
          ) as f:
              config.write(f)

          print("OK: config.ini")
          PY

      - name: Create uploader
        shell: bash
        run: |
          cat > upload_after_record.py <<'PY'
          import argparse
          import configparser
          import re
          import sys
          import time
          import urllib.parse
          from datetime import datetime
          from pathlib import Path

          import requests


          CONFIG_FILE = Path("config/config.ini")


          def log(message):
              print(
                  f"[XiaolanUpload] {message}",
                  flush=True
              )


          def yes(value):
              return str(value).strip().lower() in {
                  "是",
                  "yes",
                  "true",
                  "1",
                  "on",
              }


          def safe_name(value):
              value = str(
                  value or ""
              ).strip()

              value = re.sub(
                  r'[\\/:*?"<>|]',
                  "_",
                  value
              )

              value = re.sub(
                  r"\s+",
                  " ",
                  value
              ).strip(" ._")

              return value or "未知主播"


          def load_config():
              config = configparser.ConfigParser(
                  interpolation=None
              )

              config.read(
                  CONFIG_FILE,
                  encoding="utf-8-sig"
              )

              if "小蓝网盘" not in config:
                  raise RuntimeError(
                      "缺少 [小蓝网盘]"
                  )

              return config["小蓝网盘"]


          def join_url(base, *parts):
              result = base.rstrip("/")

              for part in parts:
                  part = str(
                      part or ""
                  ).strip("/")

                  if not part:
                      continue

                  result += (
                      "/"
                      + urllib.parse.quote(
                          part,
                          safe=""
                      )
                  )

              return result


          def ensure_collection(
              session,
              url,
              auth
          ):
              response = session.request(
                  "PROPFIND",
                  url,
                  auth=auth,
                  headers={
                      "Depth": "0",
                      "User-Agent":
                          "DouyinLiveRecorder-WebDAV",
                  },
                  timeout=30,
                  allow_redirects=True
              )

              if response.status_code in (
                  200,
                  207,
              ):
                  return

              if response.status_code == 404:
                  response = session.request(
                      "MKCOL",
                      url,
                      auth=auth,
                      headers={
                          "User-Agent":
                              "DouyinLiveRecorder-WebDAV",
                      },
                      timeout=30,
                      allow_redirects=True
                  )

                  if response.status_code in (
                      200,
                      201,
                      204,
                      405,
                  ):
                      return

                  raise RuntimeError(
                      "创建目录失败 HTTP "
                      + str(
                          response.status_code
                      )
                  )

              if response.status_code == 405:
                  return

              raise RuntimeError(
                  "检查目录失败 HTTP "
                  + str(
                      response.status_code
                  )
              )


          def ensure_remote_path(
              session,
              base_url,
              root_dir,
              anchor_dir,
              date_dir,
              auth
          ):
              current = base_url.rstrip("/")

              components = []

              for source in (
                  root_dir,
                  anchor_dir,
                  date_dir,
              ):
                  if not source:
                      continue

                  for part in str(
                      source
                  ).split("/"):
                      part = part.strip()

                      if part:
                          components.append(
                              part
                          )

              for part in components:
                  current = join_url(
                      current,
                      part
                  )

                  ensure_collection(
                      session,
                      current,
                      auth
                  )

              return current


          def get_mp4_candidates(
              save_file_path
          ):
              source = Path(
                  save_file_path
              )

              folder = source.parent
              stem = source.stem

              result = []

              exact = folder / (
                  stem + ".mp4"
              )

              if exact.exists():
                  result.append(
                      exact
                  )

              prefix = (
                  stem.rsplit("_", 1)[0]
                  if "_" in stem
                  else stem
              )

              for file in folder.glob(
                  "*.mp4"
              ):
                  if file in result:
                      continue

                  if (
                      file.stem == stem
                      or file.stem.startswith(
                          prefix + "_"
                      )
                  ):
                      result.append(
                          file
                      )

              return sorted(
                  result,
                  key=lambda p:
                      p.stat().st_mtime
                      if p.exists()
                      else 0
              )


          def file_is_stable(
              path
          ):
              if not path.exists():
                  return False

              first = path.stat().st_size

              if first <= 0:
                  return False

              time.sleep(5)

              if not path.exists():
                  return False

              second = path.stat().st_size

              return (
                  first == second
                  and second > 0
              )


          def wait_for_mp4(
              save_file_path,
              timeout
          ):
              deadline = (
                  time.time()
                  + timeout
              )

              log(
                  "等待 MP4 转换完成..."
              )

              while time.time() < deadline:
                  candidates = (
                      get_mp4_candidates(
                          save_file_path
                      )
                  )

                  ready = []

                  for file in candidates:
                      if file_is_stable(
                          file
                      ):
                          ready.append(
                              file
                          )

                  if ready:
                      return ready

                  time.sleep(5)

              return []


          def upload(
              session,
              local_file,
              remote_folder,
              auth,
              retries
          ):
              remote_url = join_url(
                  remote_folder,
                  local_file.name
              )

              for attempt in range(
                  1,
                  retries + 1
              ):
                  try:
                      size = (
                          local_file
                          .stat()
                          .st_size
                      )

                      log(
                          f"上传 {local_file.name} "
                          f"{size / 1024 / 1024:.1f}MB "
                          f"({attempt}/{retries})"
                      )

                      with local_file.open(
                          "rb"
                      ) as fp:
                          response = (
                              session.put(
                                  remote_url,
                                  data=fp,
                                  auth=auth,
                                  headers={
                                      "Content-Type":
                                          "video/mp4",
                                      "User-Agent":
                                          "DouyinLiveRecorder-WebDAV",
                                  },
                                  timeout=(
                                      30,
                                      3600,
                                  ),
                                  allow_redirects=True
                              )
                          )

                      if response.status_code in (
                          200,
                          201,
                          204,
                      ):
                          verify = (
                              session.request(
                                  "PROPFIND",
                                  remote_url,
                                  auth=auth,
                                  headers={
                                      "Depth": "0",
                                  },
                                  timeout=30,
                                  allow_redirects=True
                              )
                          )

                          if verify.status_code in (
                              200,
                              207,
                          ):
                              log(
                                  "上传成功并通过校验: "
                                  f"{local_file.name}"
                              )

                              return True

                          log(
                              "远端校验失败 HTTP "
                              + str(
                                  verify.status_code
                              )
                          )

                      else:
                          log(
                              "上传失败 HTTP "
                              + str(
                                  response.status_code
                              )
                          )

                  except Exception as exc:
                      log(
                          f"上传异常: {exc}"
                      )

                  if attempt < retries:
                      delay = min(
                          60,
                          attempt * 10
                      )

                      log(
                          f"{delay}秒后重试"
                      )

                      time.sleep(
                          delay
                      )

              return False


          def main():
              parser = argparse.ArgumentParser(
                  add_help=False
              )

              parser.add_argument(
                  "--record_name",
                  default=""
              )

              parser.add_argument(
                  "--save_file_path",
                  default=""
              )

              args, _ = (
                  parser.parse_known_args()
              )

              if not args.save_file_path:
                  log(
                      "没有收到录像文件路径"
                  )

                  return 0

              cfg = load_config()

              if not yes(
                  cfg.get(
                      "自动上传录像",
                      "否"
                  )
              ):
                  log(
                      "自动上传未开启"
                  )

                  return 0

              url = cfg.get(
                  "WebDAV地址",
                  ""
              ).strip()

              username = cfg.get(
                  "WebDAV用户名",
                  ""
              ).strip()

              password = cfg.get(
                  "WebDAV密码",
                  ""
              )

              if not url.startswith(
                  (
                      "http://",
                      "https://",
                  )
              ):
                  log(
                      "WebDAV 地址错误"
                  )

                  return 1

              root_dir = cfg.get(
                  "上传根目录",
                  "/直播录像/"
              )

              by_anchor = yes(
                  cfg.get(
                      "按主播创建文件夹",
                      "是"
                  )
              )

              by_date = yes(
                  cfg.get(
                      "按日期创建文件夹",
                      "否"
                  )
              )

              delete_local = yes(
                  cfg.get(
                      "上传成功后删除本地",
                      "否"
                  )
              )

              try:
                  retries = max(
                      1,
                      int(
                          cfg.get(
                              "上传失败重试次数",
                              "3"
                          )
                      )
                  )
              except ValueError:
                  retries = 3

              try:
                  wait_seconds = max(
                      30,
                      int(
                          cfg.get(
                              "等待MP4最长时间(秒)",
                              "1800"
                          )
                      )
                  )
              except ValueError:
                  wait_seconds = 1800

              anchor = safe_name(
                  args.record_name
              )

              if " " in anchor:
                  anchor = safe_name(
                      anchor.split(
                          " ",
                          1
                      )[-1]
                  )

              anchor_folder = (
                  anchor
                  if by_anchor
                  else ""
              )

              date_folder = (
                  datetime.now().strftime(
                      "%Y-%m-%d"
                  )
                  if by_date
                  else ""
              )

              mp4_files = wait_for_mp4(
                  args.save_file_path,
                  wait_seconds
              )

              if not mp4_files:
                  log(
                      "没有找到转换完成的 MP4；"
                      "不会删除任何文件"
                  )

                  return 1

              session = requests.Session()

              auth = (
                  username,
                  password
              )

              try:
                  remote_folder = (
                      ensure_remote_path(
                          session,
                          url,
                          root_dir,
                          anchor_folder,
                          date_folder,
                          auth
                      )
                  )
              except Exception as exc:
                  log(
                      f"创建网盘目录失败: {exc}"
                  )

                  return 1

              all_ok = True

              for file in mp4_files:
                  ok = upload(
                      session,
                      file,
                      remote_folder,
                      auth,
                      retries
                  )

                  if not ok:
                      all_ok = False

                      log(
                          "上传失败，保留本地: "
                          f"{file}"
                      )

                      continue

                  if delete_local:
                      try:
                          file.unlink()

                          log(
                              "上传校验成功，"
                              "删除本地 MP4: "
                              f"{file.name}"
                          )

                      except Exception as exc:
                          log(
                              "上传成功，但删除"
                              f"本地失败: {exc}"
                          )

              return (
                  0
                  if all_ok
                  else 1
              )


          if __name__ == "__main__":
              sys.exit(
                  main()
              )
          PY

      - name: Replace webui.py
        shell: bash
        run: |
          cat > webui.py <<'PY'
          from flask import Flask, render_template, request, redirect, url_for
          import configparser
          import os
          import subprocess

          import requests

          from streamget.logger import logger


          app = Flask(__name__)

          CONFIG_FILE = "config/config.ini"
          URL_CONFIG_FILE = "config/URL_config.ini"


          def read_config(file_path):
              config = configparser.ConfigParser(
                  interpolation=None
              )

              try:
                  with open(
                      file_path,
                      "r",
                      encoding="utf-8-sig"
                  ) as f:
                      content = f.read()

                  if not content.strip().startswith(
                      "["
                  ):
                      config.read_string(
                          "[DEFAULT]\n"
                          + content
                      )
                  else:
                      config.read(
                          file_path,
                          encoding="utf-8-sig"
                      )

              except FileNotFoundError:
                  pass

              return config


          def write_config(
              config,
              file_path
          ):
              with open(
                  file_path,
                  "w",
                  encoding="utf-8-sig"
              ) as configfile:
                  config.write(
                      configfile
                  )


          @app.route("/")
          def index():
              return redirect(
                  url_for(
                      "home_page"
                  )
              )


          @app.route(
              "/home",
              methods=["GET"]
          )
          def home_page():
              return render_template(
                  "index.html",
                  active_tab="home"
              )


          recording_process = None


          def start_main_recording():
              global recording_process

              if (
                  recording_process is None
                  or recording_process.poll()
                  is not None
              ):
                  try:
                      logger.info(
                          "WebUI启动时自动开始录制..."
                      )

                      recording_process = (
                          subprocess.Popen(
                              [
                                  "python",
                                  "main.py",
                              ],
                              cwd=os.getcwd()
                          )
                      )

                  except Exception as exc:
                      logger.error(
                          f"自动启动录制失败: {exc}"
                      )


          def run_with_auto_record():
              start_main_recording()

              app.run(
                  host="0.0.0.0",
                  port=5000
              )


          @app.route(
              "/url_config",
              methods=[
                  "GET",
                  "POST",
              ]
          )
          def url_config_page():
              path = os.path.join(
                  os.getcwd(),
                  "config",
                  "URL_config.ini"
              )

              if request.method == "POST":
                  content = request.form[
                      "url_config_content"
                  ]

                  with open(
                      path,
                      "w",
                      encoding="utf-8-sig"
                  ) as f:
                      f.write(
                          content
                      )

                  return redirect(
                      url_for(
                          "url_config_page",
                          success="true"
                      )
                  )

              try:
                  with open(
                      path,
                      "r",
                      encoding="utf-8-sig"
                  ) as f:
                      content = f.read()

              except FileNotFoundError:
                  content = ""

              return render_template(
                  "index.html",
                  url_config_content=content,
                  active_tab="url_config"
              )


          def config_page(
              section,
              endpoint,
              active_tab
          ):
              path = os.path.join(
                  os.getcwd(),
                  "config",
                  "config.ini"
              )

              if request.method == "POST":
                  config = read_config(
                      path
                  )

                  for key, value in (
                      request.form.items()
                  ):
                      if (
                          section in config
                          and key
                          in config[section]
                      ):
                          config.set(
                              section,
                              key,
                              value
                          )

                  write_config(
                      config,
                      path
                  )

                  return redirect(
                      url_for(
                          endpoint,
                          success="true"
                      )
                  )

              config = read_config(
                  path
              )

              return render_template(
                  "index.html",
                  config=config,
                  active_tab=active_tab,
                  section=section
              )


          @app.route(
              "/recording_settings",
              methods=[
                  "GET",
                  "POST",
              ]
          )
          def recording_settings_page():
              return config_page(
                  "录制设置",
                  "recording_settings_page",
                  "recording_settings"
              )


          @app.route(
              "/push_settings",
              methods=[
                  "GET",
                  "POST",
              ]
          )
          def push_settings_page():
              return config_page(
                  "推送配置",
                  "push_settings_page",
                  "push_settings"
              )


          @app.route(
              "/cookie_settings",
              methods=[
                  "GET",
                  "POST",
              ]
          )
          def cookie_settings_page():
              return config_page(
                  "Cookie",
                  "cookie_settings_page",
                  "cookie_settings"
              )


          @app.route(
              "/account_settings",
              methods=[
                  "GET",
                  "POST",
              ]
          )
          def account_settings_page():
              return config_page(
                  "账号密码",
                  "account_settings_page",
                  "account_settings"
              )


          @app.route(
              "/xiaolan_webdav",
              methods=[
                  "GET",
                  "POST",
              ]
          )
          def xiaolan_webdav_page():
              path = os.path.join(
                  os.getcwd(),
                  "config",
                  "config.ini"
              )

              config = read_config(
                  path
              )

              if "小蓝网盘" not in config:
                  config.add_section(
                      "小蓝网盘"
                  )

              if request.method == "POST":
                  keys = [
                      "WebDAV地址",
                      "WebDAV用户名",
                      "WebDAV密码",
                      "上传根目录",
                      "自动上传录像",
                      "按主播创建文件夹",
                      "按日期创建文件夹",
                      "上传成功后删除本地",
                      "上传失败重试次数",
                      "等待MP4最长时间(秒)",
                  ]

                  for key in keys:
                      if key in request.form:
                          config.set(
                              "小蓝网盘",
                              key,
                              request.form.get(
                                  key,
                                  ""
                              ).strip()
                          )

                  write_config(
                      config,
                      path
                  )

                  return redirect(
                      url_for(
                          "xiaolan_webdav_page",
                          success="true"
                      )
                  )

              return render_template(
                  "index.html",
                  config=config,
                  active_tab="xiaolan_webdav",
                  section="小蓝网盘"
              )


          @app.route(
              "/xiaolan_webdav/test",
              methods=["POST"]
          )
          def test_xiaolan_webdav():
              path = os.path.join(
                  os.getcwd(),
                  "config",
                  "config.ini"
              )

              config = read_config(
                  path
              )

              if "小蓝网盘" not in config:
                  return {
                      "success": False,
                      "message":
                          "请先保存 WebDAV 配置",
                  }, 400

              url = config.get(
                  "小蓝网盘",
                  "WebDAV地址",
                  fallback=""
              ).strip()

              username = config.get(
                  "小蓝网盘",
                  "WebDAV用户名",
                  fallback=""
              ).strip()

              password = config.get(
                  "小蓝网盘",
                  "WebDAV密码",
                  fallback=""
              )

              if not url.startswith(
                  (
                      "http://",
                      "https://",
                  )
              ):
                  return {
                      "success": False,
                      "message":
                          "WebDAV 地址为空或格式错误",
                  }, 400

              try:
                  response = requests.request(
                      "PROPFIND",
                      url,
                      auth=(
                          username,
                          password
                      ),
                      headers={
                          "Depth": "0",
                          "User-Agent":
                              "DouyinLiveRecorder-WebDAV",
                      },
                      timeout=15,
                      allow_redirects=True
                  )

                  if response.status_code in (
                      200,
                      201,
                      204,
                      207,
                  ):
                      return {
                          "success": True,
                          "message":
                              "小蓝网盘 WebDAV 连接成功",
                      }

                  messages = {
                      401:
                          "认证失败，请检查用户名和密码",
                      403:
                          "访问被拒绝，请检查权限",
                      404:
                          "WebDAV 地址不存在",
                  }

                  return {
                      "success": False,
                      "message": messages.get(
                          response.status_code,
                          "连接失败 HTTP "
                          + str(
                              response.status_code
                          )
                      ),
                  }, 400

              except requests.exceptions.Timeout:
                  return {
                      "success": False,
                      "message":
                          "连接超时",
                  }, 400

              except requests.exceptions.RequestException as exc:
                  logger.error(
                      f"WebDAV连接失败: {exc}"
                  )

                  return {
                      "success": False,
                      "message":
                          "无法连接 WebDAV 服务器",
                  }, 400


          @app.route("/log")
          def get_log():
              result = []

              files = [
                  os.path.join(
                      os.getcwd(),
                      "logs",
                      "streamget.log"
                  ),
                  os.path.join(
                      os.getcwd(),
                      "logs",
                      "PlayURL.log"
                  ),
              ]

              for file in files:
                  if not os.path.exists(
                      file
                  ):
                      continue

                  try:
                      with open(
                          file,
                          "r",
                          encoding="utf-8"
                      ) as f:
                          lines = f.readlines()

                      result.extend(
                          lines[-100:]
                      )

                  except Exception as exc:
                      result.append(
                          f"Error reading {file}: "
                          f"{exc}\n"
                      )

              return "".join(
                  result
              )


          if __name__ == "__main__":
              run_with_auto_record()
          PY

      - name: Patch HTML
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "templates/index.html"
          )

          html = path.read_text(
              encoding="utf-8"
          )

          html = re.sub(
              r'\s*<a[^>]*xiaolan_webdav_page[\s\S]*?</a>',
              "",
              html
          )

          html = re.sub(
              r'\s*<!-- XIAOLAN_START -->[\s\S]*?<!-- XIAOLAN_END -->',
              "",
              html
          )

          marker = (
              '<a href="{{ url_for('
              "'account_settings_page'"
              ') }}"'
          )

          pos = html.find(
              marker
          )

          if pos < 0:
              raise RuntimeError(
                  "找不到账号密码菜单"
              )

          end = html.find(
              "</a>",
              pos
          )

          if end < 0:
              raise RuntimeError(
                  "账号密码菜单结构错误"
              )

          end += 4

          tab = '''
                <a href="{{ url_for('xiaolan_webdav_page') }}"
                   class="tab-button {% if active_tab == 'xiaolan_webdav' %}active{% endif %}">
                    小蓝网盘
                </a>'''

          html = (
              html[:end]
              + tab
              + html[end:]
          )

          end_marker = (
              "            {% endif %}\n"
              "    </div>\n"
              "    <script>"
          )

          if end_marker not in html:
              raise RuntimeError(
                  "找不到主页面结束位置"
              )

          page = '''
            <!-- XIAOLAN_START -->
            {% elif active_tab == 'xiaolan_webdav' %}
            <div class="config-section">
                <h2>小蓝网盘 WebDAV</h2>

                <p style="color:#666;line-height:1.7;">
                    录像转换为 MP4 后上传。
                    每个主播可以自动建立独立文件夹。
                    上传成功并通过远端校验后，
                    才会根据设置删除本地录像。
                </p>

                <form
                    action="{{ url_for('xiaolan_webdav_page') }}"
                    method="post"
                >
                    <div class="form-group">
                        <label>WebDAV 地址</label>
                        <input
                            type="text"
                            name="WebDAV地址"
                            value="{{ config.get(section, 'WebDAV地址', fallback='') }}"
                        >
                    </div>

                    <div class="form-group">
                        <label>WebDAV 用户名</label>
                        <input
                            type="text"
                            name="WebDAV用户名"
                            value="{{ config.get(section, 'WebDAV用户名', fallback='') }}"
                        >
                    </div>

                    <div class="form-group">
                        <label>WebDAV 密码</label>
                        <input
                            type="password"
                            name="WebDAV密码"
                            value="{{ config.get(section, 'WebDAV密码', fallback='') }}"
                            style="width:calc(100% - 22px);padding:10px;box-sizing:border-box;"
                        >
                    </div>

                    <div class="form-group">
                        <label>上传根目录</label>
                        <input
                            type="text"
                            name="上传根目录"
                            value="{{ config.get(section, '上传根目录', fallback='/直播录像/') }}"
                        >
                    </div>

                    {% set au = config.get(section, '自动上传录像', fallback='否') %}
                    <div class="form-group">
                        <label>自动上传录像</label>
                        <select name="自动上传录像">
                            <option value="是" {% if au == '是' %}selected{% endif %}>是</option>
                            <option value="否" {% if au != '是' %}selected{% endif %}>否</option>
                        </select>
                    </div>

                    {% set ba = config.get(section, '按主播创建文件夹', fallback='是') %}
                    <div class="form-group">
                        <label>按主播创建文件夹</label>
                        <select name="按主播创建文件夹">
                            <option value="是" {% if ba == '是' %}selected{% endif %}>是</option>
                            <option value="否" {% if ba != '是' %}selected{% endif %}>否</option>
                        </select>
                    </div>

                    {% set bd = config.get(section, '按日期创建文件夹', fallback='否') %}
                    <div class="form-group">
                        <label>按日期创建文件夹</label>
                        <select name="按日期创建文件夹">
                            <option value="是" {% if bd == '是' %}selected{% endif %}>是</option>
                            <option value="否" {% if bd != '是' %}selected{% endif %}>否</option>
                        </select>
                    </div>

                    {% set dl = config.get(section, '上传成功后删除本地', fallback='否') %}
                    <div class="form-group">
                        <label>上传成功后删除本地</label>
                        <select name="上传成功后删除本地">
                            <option value="是" {% if dl == '是' %}selected{% endif %}>是</option>
                            <option value="否" {% if dl != '是' %}selected{% endif %}>否</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>上传失败重试次数</label>
                        <input
                            type="text"
                            name="上传失败重试次数"
                            value="{{ config.get(section, '上传失败重试次数', fallback='3') }}"
                        >
                    </div>

                    <div class="form-group">
                        <label>等待 MP4 最长时间（秒）</label>
                        <input
                            type="text"
                            name="等待MP4最长时间(秒)"
                            value="{{ config.get(section, '等待MP4最长时间(秒)', fallback='1800') }}"
                        >
                    </div>

                    <button type="submit">
                        保存小蓝网盘设置
                    </button>
                </form>

                <button
                    type="button"
                    id="xiaolan-test-btn"
                    style="width:100%;margin-top:12px;padding:12px;"
                >
                    测试 WebDAV 连接
                </button>

                <div
                    id="xiaolan-test-result"
                    style="display:none;margin-top:12px;padding:12px;"
                ></div>
            </div>
            <!-- XIAOLAN_END -->
          '''

          html = html.replace(
              end_marker,
              page
              + "\n"
              + "            {% endif %}\n"
              + "    </div>\n"
              + "    <script>",
              1
          )

          test_js = '''
          <script id="xiaolan-test-js">
          document.addEventListener(
              'DOMContentLoaded',
              function () {
                  const button =
                      document.getElementById(
                          'xiaolan-test-btn'
                      );

                  const result =
                      document.getElementById(
                          'xiaolan-test-result'
                      );

                  if (!button || !result) {
                      return;
                  }

                  button.addEventListener(
                      'click',
                      async function () {
                          button.disabled = true;
                          button.textContent =
                              '正在测试...';

                          result.style.display =
                              'block';

                          result.textContent =
                              '正在连接...';

                          try {
                              const response =
                                  await fetch(
                                      '/xiaolan_webdav/test',
                                      {
                                          method: 'POST'
                                      }
                                  );

                              const data =
                                  await response.json();

                              result.textContent =
                                  data.message;

                              if (
                                  response.ok
                                  && data.success
                              ) {
                                  result.style.background =
                                      '#d4edda';
                              } else {
                                  result.style.background =
                                      '#f8d7da';
                              }

                          } catch (error) {
                              result.textContent =
                                  '测试请求失败';

                              result.style.background =
                                  '#f8d7da';

                          } finally {
                              button.disabled = false;

                              button.textContent =
                                  '测试 WebDAV 连接';
                          }
                      }
                  );
              }
          );
          </script>
          '''

          html = re.sub(
              r'\s*<script id="xiaolan-test-js">[\s\S]*?</script>',
              "",
              html
          )

          html = html.replace(
              "</body>",
              test_js
              + "\n</body>",
              1
          )

          html = "\n".join(
              line.rstrip()
              for line
              in html.splitlines()
          ) + "\n"

          path.write_text(
              html,
              encoding="utf-8"
          )

          print(
              "OK: index.html"
          )
          PY

      - name: Clean whitespace
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          files = [
              (
                  Path("webui.py"),
                  "utf-8",
              ),
              (
                  Path("upload_after_record.py"),
                  "utf-8",
              ),
              (
                  Path("templates/index.html"),
                  "utf-8",
              ),
              (
                  Path("config/config.ini"),
                  "utf-8-sig",
              ),
          ]

          for path, encoding in files:
              text = path.read_text(
                  encoding=encoding
              )

              lines = [
                  line.rstrip()
                  for line in text.splitlines()
              ]

              while (
                  lines
                  and not lines[-1].strip()
              ):
                  lines.pop()

              path.write_text(
                  "\n".join(lines)
                  + "\n",
                  encoding=encoding
              )

              print(
                  f"OK: cleaned {path}"
              )
          PY

      - name: Check diff
        run: |
          git diff --check
          git status --short
          git diff --stat

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python syntax check
        run: |
          python -m py_compile webui.py
          python -m py_compile main.py
          python -m py_compile upload_after_record.py

      - name: Flask route check
        run: |
          python <<'PY'
          import webui

          routes = {
              rule.rule
              for rule
              in webui.app.url_map.iter_rules()
          }

          required = {
              "/home",
              "/url_config",
              "/recording_settings",
              "/push_settings",
              "/cookie_settings",
              "/account_settings",
              "/xiaolan_webdav",
              "/xiaolan_webdav/test",
              "/log",
          }

          missing = (
              required - routes
          )

          if missing:
              raise RuntimeError(
                  f"缺少路由: {missing}"
              )

          print(
              "OK: Flask routes"
          )
          PY

      - name: Template render check
        run: |
          python <<'PY'
          import webui

          client = (
              webui.app.test_client()
          )

          pages = [
              "/home",
              "/url_config",
              "/recording_settings",
              "/push_settings",
              "/cookie_settings",
              "/account_settings",
              "/xiaolan_webdav",
          ]

          for page in pages:
              response = client.get(
                  page
              )

              print(
                  page,
                  response.status_code
              )

              if response.status_code != 200:
                  print(
                      response.data.decode(
                          "utf-8",
                          errors="replace"
                      )
                  )

                  raise RuntimeError(
                      f"页面失败: {page}"
                  )

          print(
              "OK: templates"
          )
          PY

      - name: Config check
        run: |
          python <<'PY'
          import configparser

          config = configparser.ConfigParser(
              interpolation=None
          )

          config.read(
              "config/config.ini",
              encoding="utf-8-sig"
          )

          if "小蓝网盘" not in config:
              raise RuntimeError(
                  "缺少小蓝网盘配置"
              )

          recording = config[
              "录制设置"
          ]

          if (
              recording.get(
                  "是否录制完成后执行自定义脚本",
                  ""
              )
              != "是"
          ):
              raise RuntimeError(
                  "上传脚本没有启用"
              )

          if (
              "upload_after_record.py"
              not in recording.get(
                  "自定义脚本执行命令",
                  ""
              )
          ):
              raise RuntimeError(
                  "上传脚本没有接入"
              )

          print(
              "OK: config"
          )
          PY

      - name: Uploader dry run
        run: |
          python upload_after_record.py \
            --record_name "测试主播" \
            --save_file_path "/tmp/test.ts"

      - name: Commit changes
        run: |
          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            webui.py \
            upload_after_record.py \
            templates/index.html \
            config/config.ini

          if git diff --cached --quiet; then
            echo "没有修改"
            exit 0
          fi

          git commit \
            -m "feat: add Xiaolan WebDAV auto upload"

          git push origin HEAD:main

      - name: Summary
        run: |
          {
            echo "## ✅ Xiaolan WebDAV V3.3"
            echo
            echo "- 修复 config.ini trailing whitespace"
            echo "- 修复文件末尾多余空行"
            echo "- 修复 webui.py 缩进问题"
            echo "- WebDAV 配置与测试"
            echo "- MP4 自动上传"
            echo "- 每个主播独立文件夹"
            echo "- 可选按日期目录"
            echo "- 上传失败重试"
            echo "- 上传成功远端校验"
            echo "- 成功后可自动删除本地 MP4"
            echo "- 上传失败绝不删除录像"
            echo
            echo "默认自动上传：否"
            echo "默认自动删除：否"
          } >> "$GITHUB_STEP_SUMMARY"
